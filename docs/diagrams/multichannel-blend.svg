<polygon points="172,58 165,61.5 165,54.5" class="head"/>
<rect x="176" y="30" width="260" height="56" rx="6" class="box"/>
<text x="190" y="52" font-weight="600">transfer function</text>
<rect x="190" y="62" width="232" height="12" class="panel" stroke-width="1" style="fill:url(#kiln-mc-tf)"/>
<path d="M333.8,58 v20" class="line" stroke-width="2"/>
<path d="M440,58 L472,58" class="line" stroke-width="1.5"/>
<polygon points="478,58 471,61.5 471,54.5" class="head"/>
<rect x="482" y="34" width="48" height="48" rx="6" class="panel" stroke-width="1" style="fill:#35b779"/>
