name: Deploy Preview

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Sanitize branch name for URL
        shell: bash
        run: echo "sanitized=$(echo '${{ steps.extract_branch.outputs.branch }}' | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
        id: sanitize

      # VITE_BASE is the site-root prefix; the viewer configs derive /app/ from
      # it, so the same prefix drives all three builds (site at the preview
      # root, viewers under <preview>/app/). The VitePress site owns dist/ and
      # empties it, so it builds FIRST; the viewers then repopulate dist/app/
      # (app before multichannel — see deploy.yml).
      #
      # Base is domain-aware, mirroring deploy.yml:
      #   - kiln-render (custom apex domain): the gh-pages root is served at
      #     kilnrender.com, so a preview lives at kilnrender.com/preview/<b>/ —
      #     base = /preview/<b>/ (NO repo prefix).
      #   - any other repo (e.g. kiln-render-private): served at
      #     <owner>.github.io/<repo>/, so base = /<repo>/preview/<b>/.
      # VITE_PREVIEW marks the VitePress build so it emits <meta robots=noindex>
      # — public-repo previews sit under the production domain and must not be
      # indexed alongside the real site.
      - name: Build marketing site with branch-specific base
        run: bun run build:site
        env:
          VITE_BASE: ${{ github.event.repository.name == 'kiln-render' && format('/preview/{0}/', steps.sanitize.outputs.sanitized) || format('/{0}/preview/{1}/', github.event.repository.name, steps.sanitize.outputs.sanitized) }}
          VITE_PREVIEW: '1'

      - name: Build viewer app with branch-specific base
        run: bun run build
        env:
          VITE_BASE: ${{ github.event.repository.name == 'kiln-render' && format('/preview/{0}/', steps.sanitize.outputs.sanitized) || format('/{0}/preview/{1}/', github.event.repository.name, steps.sanitize.outputs.sanitized) }}

      - name: Build multichannel viewer with branch-specific base
        run: bun run build:multichannel
        env:
          VITE_BASE: ${{ github.event.repository.name == 'kiln-render' && format('/preview/{0}/', steps.sanitize.outputs.sanitized) || format('/{0}/preview/{1}/', github.event.repository.name, steps.sanitize.outputs.sanitized) }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/${{ steps.sanitize.outputs.sanitized }}
          keep_files: true

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const branchName = '${{ steps.sanitize.outputs.sanitized }}';
            const repo = '${{ github.event.repository.name }}';
            // Production repo is served at the custom apex domain root; others at github.io/<repo>/.
            const previewUrl = repo === 'kiln-render'
              ? `https://kilnrender.com/preview/${branchName}/`
              : `https://${{ github.repository_owner }}.github.io/${repo}/preview/${branchName}/`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployed to: ${previewUrl}`
            });
