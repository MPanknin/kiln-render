name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Landing/gallery/docs at the site root (dist/), viewers under dist/app/.
      # Repo-agnostic base so this is safe on BOTH remotes:
      #   - kiln-render (production, custom apex domain): served at kilnrender.com
      #     root, so VITE_BASE = '/'.
      #   - kiln-render-private (staging) or any other: no custom domain, served
      #     at <owner>.github.io/<repo>/, so VITE_BASE = '/<repo>/'.
      # The viewer configs derive /app/ from VITE_BASE. (Branch previews use a
      # repo-name base in deploy-preview.yml.)
      #
      # Build order matters: the VitePress site owns dist/ and empties it, so it
      # runs FIRST; the viewer builds then repopulate dist/app/ (their own
      # emptyOutDir is scoped to those subfolders). App before multichannel so
      # the app build doesn't wipe dist/app/multichannel/.
      - name: Build marketing site (landing / gallery / docs)
        run: bun run build:site
        env:
          VITE_BASE: ${{ github.event.repository.name == 'kiln-render' && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Build viewer app
        run: bun run build
        env:
          VITE_BASE: ${{ github.event.repository.name == 'kiln-render' && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Build multichannel viewer
        run: bun run build:multichannel
        env:
          VITE_BASE: ${{ github.event.repository.name == 'kiln-render' && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          # Custom apex domain ONLY on the production repo. Empty elsewhere so
          # staging (kiln-render-private) never claims kilnrender.com — two repos
          # claiming one domain breaks GitHub Pages' domain verification.
          # peaceiris skips writing CNAME when this is empty.
          cname: ${{ github.event.repository.name == 'kiln-render' && 'kilnrender.com' || '' }}
