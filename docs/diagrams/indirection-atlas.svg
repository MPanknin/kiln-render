<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-size="12" role="img" aria-label="Each indirection cell stores an atlas slot and a LOD. A LOD 1 brick fills a 2 × 2 block of cells that all point to one slot; a finer LOD 0 brick overrides just its own cell.">
