name: Publish Check

# Guards the published package's shape and types. Would have caught the 0.4.0
# type leaks (zarrita import + missing @webgpu/types) before release: publint
# validates package.json/exports, and are-the-types-wrong (ATTW) compiles the
# packed tarball as a consumer would — including strict resolution that surfaces
# leaked/unresolvable type imports.
on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  publish-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build library
        run: npm run build:lib

      - name: Validate package (publint)
        # publint picks the packer from lockfiles; bun.lock makes it run
        # `bun pack`, and the runner has no bun. CI installs with npm, so pack with npm.
        run: npx --yes publint --pack npm

      - name: Validate types against a consumer (are-the-types-wrong)
        # --pack packs the tarball and type-checks it the way an installer sees it.
        # The package is ESM-only by design (exports has only "import"), so skip
        # the CommonJS resolution modes instead of failing on "dynamic import only".
        run: npx --yes @arethetypeswrong/cli --pack . --profile esm-only
