<rect x="40" y="230" width="51" height="10" rx="2" class="muted"/>
<text x="158" y="239" class="muted" font-size="14" text-anchor="middle">×</text>
<rect x="174" y="225" width="20" height="20" rx="4" class="panel" stroke-width="1" style="fill:#ff0000"/>
<path d="M198,235 C270,235 280,220 310,220" class="line" stroke-width="1.5"/>
<text x="0" y="271" class="mono muted" font-size="11">ch 3</text>
<rect x="40" y="262" width="102" height="10" rx="2" class="panel" stroke-width="1"/>
<rect x="40" y="262" width="10" height="10" rx="2" class="muted"/>
<text x="158" y="271" class="muted" font-size="14" text-anchor="middle">×</text>
<rect x="174" y="257" width="20" height="20" rx="4" class="panel" stroke-width="1" style="fill:#ffffff"/>
<path d="M198,267 C270,267 280,220 310,220" class="line" stroke-width="1.5"/>
<circle cx="330" cy="220" r="18" class="box" stroke-width="1.5"/>
<text x="330" y="226" font-size="18" text-anchor="middle" font-weight="600">+</text>
<path d="M350,220 L380,220" class="line" stroke-width="1.5"/>
<polygon points="386,220 379,223.5 379,216.5" class="head"/>
<rect x="390" y="196" width="48" height="48" rx="6" class="panel" stroke-width="1" style="fill:#ff80cc"/>
<text x="452" y="208" font-weight="600">summed colour</text>
<text x="452" y="226" class="muted">no transfer function;</text>
<text x="452" y="244" class="muted">opacity from the strongest channel</text>
