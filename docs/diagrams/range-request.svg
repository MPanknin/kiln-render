<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-size="12" role="img" aria-label="The index gives brick 2/0/0 an offset and a size; one HTTP Range request then reads exactly that brick out of lod0.bin.">
<style>
text{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{fill:#59636e}.faint{fill:#818b98}
.box{fill:#f6f8fa;stroke:#d1d9e0}.panel{fill:none;stroke:#d1d9e0}.page{fill:#fff}
.line{fill:none;stroke:#818b98}.head{fill:#818b98}
.accent{fill:rgba(9,105,218,.12);stroke:#0969da}.accent-line{fill:none;stroke:#0969da}.accent-head,.accent-text{fill:#0969da}
.ok{fill:rgba(26,127,55,.12);stroke:#1a7f37}.ok-line{fill:none;stroke:#1a7f37}.ok-text{fill:#1a7f37}
.bad{fill:rgba(207,34,46,.1);stroke:#cf222e}.bad-text{fill:#cf222e}
@media (prefers-color-scheme:dark){
text{fill:#f0f6fc}.muted{fill:#9198a1}.faint{fill:#656c76}
.box{fill:#151b23;stroke:#3d444d}.panel{stroke:#3d444d}.page{fill:#0d1117}
.line{stroke:#656c76}.head{fill:#656c76}
.accent{fill:rgba(68,147,248,.15);stroke:#4493f8}.accent-line{stroke:#4493f8}.accent-head,.accent-text{fill:#4493f8}
.ok{fill:rgba(63,185,80,.15);stroke:#3fb950}.ok-line{stroke:#3fb950}.ok-text{fill:#3fb950}
.bad{fill:rgba(248,81,73,.15);stroke:#f85149}.bad-text{fill:#f85149}}
</style>
<rect x="0" y="0" width="300" height="86" rx="6" class="box"/>
<text x="14" y="22" class="mono" font-size="12" font-weight="600">lod0_index.json</text>
<text x="14" y="44" class="mono" font-size="11.5">"2/0/0": {</text>
<text x="14" y="61" class="mono" font-size="11.5">  "offset": <tspan class="accent-text">205084</tspan>,</text>
<text x="14" y="78" class="mono" font-size="11.5">  "size": <tspan class="accent-text">98412</tspan>, … }</text>
<path d="M304,43 L376,43" class="line" stroke-width="1.5"/>
<polygon points="382,43 375,46.5 375,39.5" class="head"/>
<text x="343" y="35" class="muted" font-size="11" text-anchor="middle">look up</text>
<rect x="386" y="0" width="334" height="86" rx="6" class="accent" stroke-width="1.5"/>
<text x="400" y="26" class="mono" font-size="12">GET /datasets/volume/lod0.bin</text>
<text x="400" y="48" class="mono accent-text" font-size="12" font-weight="600">Range: bytes=205084-303495</text>
<text x="400" y="70" class="muted">98,412 bytes, nothing else</text>
<text x="0" y="136" class="mono" font-size="12" font-weight="600">lod0.bin</text>
<text x="0" y="222" class="muted">gzip-compressed bricks back to back (x fastest), so offsets come from the index</text>
<rect x="0" y="146" width="75" height="40" class="box" stroke-width="1"/>
<text x="37.5" y="171" class="mono muted" font-size="13" text-anchor="middle">0</text>
<rect x="75" y="146" width="176" height="40" class="box" stroke-width="1"/>
<text x="163" y="171" class="mono muted" font-size="13" text-anchor="middle">1</text>
<rect x="251" y="146" width="120" height="40" class="accent" stroke-width="1.5"/>
<text x="311" y="171" class="mono accent-text" font-size="13" text-anchor="middle" font-weight="600">2</text>
<rect x="371" y="146" width="110" height="40" class="box" stroke-width="1"/>
<text x="426" y="171" class="mono muted" font-size="13" text-anchor="middle">3</text>
<rect x="481" y="146" width="90" height="40" class="box" stroke-width="1"/>
<text x="526" y="171" class="mono muted" font-size="13" text-anchor="middle">4</text>
<rect x="571" y="146" width="60" height="40" class="panel" stroke-width="1" stroke-dasharray="3 3"/>
<text x="601" y="171" class="mono muted" font-size="13" text-anchor="middle">…</text>
<rect x="631" y="146" width="89" height="40" class="box" stroke-width="1"/>
<text x="675.5" y="171" class="mono muted" font-size="13" text-anchor="middle">N</text>
<text x="0" y="202" class="mono faint" font-size="10.5" text-anchor="start">0</text>
<text x="75" y="202" class="mono faint" font-size="10.5" text-anchor="middle">61,204</text>
<text x="251" y="202" class="mono faint" font-size="10.5" text-anchor="middle">205,084</text>
<text x="371" y="202" class="mono faint" font-size="10.5" text-anchor="middle">303,496</text>
<path d="M553,90 C553,118 311,112 311,136" class="accent-line" stroke-width="1.5"/>
<polygon points="311,142 307.5,135 314.5,135" class="accent-head"/>
</svg>
