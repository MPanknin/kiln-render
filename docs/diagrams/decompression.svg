<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 116" width="720" height="116" font-size="12" role="img" aria-label="Brick path: the main thread fetches gzip bytes, a pool of up to 8 workers decompresses and converts them, and the main thread uploads the 66³ voxels into an atlas slot.">
<style>
text{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{fill:#59636e}.faint{fill:#818b98}
.box{fill:#f6f8fa;stroke:#d1d9e0}.panel{fill:none;stroke:#d1d9e0}.page{fill:#fff}
.line{fill:none;stroke:#818b98}.head{fill:#818b98}
.accent{fill:rgba(9,105,218,.12);stroke:#0969da}.accent-line{fill:none;stroke:#0969da}.accent-head,.accent-text{fill:#0969da}
.ok{fill:rgba(26,127,55,.12);stroke:#1a7f37}.ok-line{fill:none;stroke:#1a7f37}.ok-text{fill:#1a7f37}
.bad{fill:rgba(207,34,46,.1);stroke:#cf222e}.bad-text{fill:#cf222e}
@media (prefers-color-scheme:dark){
text{fill:#f0f6fc}.muted{fill:#9198a1}.faint{fill:#656c76}
.box{fill:#151b23;stroke:#3d444d}.panel{stroke:#3d444d}.page{fill:#0d1117}
.line{stroke:#656c76}.head{fill:#656c76}
.accent{fill:rgba(68,147,248,.15);stroke:#4493f8}.accent-line{stroke:#4493f8}.accent-head,.accent-text{fill:#4493f8}
.ok{fill:rgba(63,185,80,.15);stroke:#3fb950}.ok-line{stroke:#3fb950}.ok-text{fill:#3fb950}
.bad{fill:rgba(248,81,73,.15);stroke:#f85149}.bad-text{fill:#f85149}}
</style>
<rect x="0" y="30" width="150" height="62" rx="6" class="box"/>
<text x="14" y="56" font-weight="600">Range response</text>
<text x="14" y="75" class="muted">gzip bytes</text>
<path d="M152,61 L186,61" class="line" stroke-width="1.5"/>
<polygon points="192,61 185,64.5 185,57.5" class="head"/>
<rect x="208" y="14" width="210" height="62" rx="6" class="box"/>
<rect x="202" y="22" width="210" height="62" rx="6" class="box"/>
<rect x="196" y="30" width="210" height="62" rx="6" class="accent" stroke-width="1.5"/>
<text x="210" y="56" font-weight="600">DecompressionPool</text>
<text x="210" y="75" class="muted">gunzip, convert to atlas format</text>
<path d="M420,61 L450,61" class="line" stroke-width="1.5"/>
<polygon points="456,61 449,64.5 449,57.5" class="head"/>
<rect x="460" y="30" width="116" height="62" rx="6" class="box"/>
<text x="474" y="56" font-weight="600">66³ voxels</text>
<text x="474" y="75" class="muted">r8 / r16 data</text>
<path d="M578,61 L600,61" class="line" stroke-width="1.5"/>
<polygon points="606,61 599,64.5 599,57.5" class="head"/>
<rect x="610" y="30" width="110" height="62" rx="6" class="box"/>
<text x="624" y="56" font-weight="600">Atlas slot</text>
<text x="624" y="75" class="muted mono" font-size="11">writeTexture</text>
<text x="0" y="114" class="faint" font-size="11">main thread</text>
<text x="196" y="114" class="faint" font-size="11">up to 8 Web Workers</text>
<text x="460" y="114" class="faint" font-size="11">main thread</text>
</svg>
